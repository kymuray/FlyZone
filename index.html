<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        html {
            scroll-behavior: smooth;
        }
        
        section {
            scroll-margin-top: 70px;
            min-height: 400px;
        }
    </style>
</head>
<body>

    <!-- Menu fixo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#inicio">Meu Site</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#inicio">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="#sobre">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="#servicos">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contato">Contato</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Seção Início -->
    <section id="inicio" class="d-flex align-items-center" style="min-height: 100vh; background-color: #f8f9fa;">
        <div class="container">
            <h1>Bem-vindo</h1>
            <p>Este é o conteúdo da página inicial.</p>
            <a href="#contato" class="btn btn-primary">Fale Conosco</a>
        </div>
    </section>

    <!-- Seção Sobre -->
    <section id="sobre" class="py-5">
        <div class="container">
            <h2>Sobre</h2>
            <p>Informações sobre a empresa ou projeto.</p>
        </div>
    </section>

    <!-- Seção Serviços -->
    <section id="servicos" class="py-5 bg-light">
        <div class="container">
            <h2>Serviços</h2>
            <div class="row">
                <div class="col-md-4">
                    <h3>Serviço 1</h3>
                    <p>Descrição do serviço.</p>
                </div>
                <div class="col-md-4">
                    <h3>Serviço 2</h3>
                    <p>Descrição do serviço.</p>
                </div>
                <div class="col-md-4">
                    <h3>Serviço 3</h3>
                    <p>Descrição do serviço.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Seção Contato -->
    <section id="contato" class="py-5">
        <div class="container">
            <h2>Contato</h2>
            <form>
                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mensagem</label>
                    <textarea class="form-control" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
